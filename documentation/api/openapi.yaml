openapi: 3.1.1
info:
  title: Homebank API
  version: 1.0.0
  description: |
    Machine-readable API contract for Homebank backend.
    Human-readable companion docs live in documentation/api/endpoints.md.
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Account Recovery
  - name: Users
  - name: Customers
  - name: Transaction Heads
  - name: Transaction Rows

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationDTO'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Secure, HTTP-only refresh-token cookie.
              schema:
                type: string
                example: refreshToken=<opaque-refresh-token>; Path=/auth; Max-Age=604800; Secure; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDTO'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes the refresh token when the cookie is present and always deletes the browser cookie.
      parameters:
        - name: refreshToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Deletes the refresh-token cookie.
              schema:
                type: string
                example: refreshToken=; Path=/auth; Max-Age=0; Secure; HttpOnly; SameSite=Strict
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDTO'
      responses:
        '200':
          description: Registration accepted
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token and rotate refresh token
      security: []
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens refreshed
          headers:
            Set-Cookie:
              description: Rotated secure, HTTP-only refresh-token cookie.
              schema:
                type: string
                example: refreshToken=<new-opaque-refresh-token>; Path=/auth; Max-Age=604800; Secure; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/activate:
    get:
      tags: [Auth]
      summary: Activate account
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/resend-activation:
    post:
      tags: [Auth]
      summary: Resend activation email for authenticated user
      responses:
        '200':
          description: Request processed
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /account-recovery/initiate:
    post:
      tags: [Account Recovery]
      summary: Initiate account recovery
      description: Returns 200 for valid payloads regardless of whether the e-mail exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDTO'
      responses:
        '200':
          description: Recovery request processed
        '400':
          $ref: '#/components/responses/BadRequestError'

  /account-recovery/authenticate:
    post:
      tags: [Account Recovery]
      summary: Authenticate account recovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationDTO'
      responses:
        '200':
          description: Recovery token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryTokenDTO'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /account-recovery/set-new-password:
    post:
      tags: [Account Recovery]
      summary: Set new password using recovery token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNewPasswordDTO'
      responses:
        '200':
          description: Password changed
          headers:
            Set-Cookie:
              description: Secure, HTTP-only refresh-token cookie.
              schema:
                type: string
                example: refreshToken=<opaque-refresh-token>; Path=/auth; Max-Age=604800; Secure; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDTO'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/changePassword:
    post:
      tags: [Users]
      summary: Change password for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDTO'
      responses:
        '200':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /customers:
    get:
      tags: [Customers]
      summary: Get accessible customers
      responses:
        '200':
          description: Customers returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerDTO'
      responses:
        '200':
          description: Customer created
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /customers/{customerId}:
    get:
      tags: [Customers]
      summary: Get customer by id
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Customer returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Customers]
      summary: Update customer
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerDTO'
      responses:
        '200':
          description: Customer updated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags: [Customers]
      summary: Delete customer (owner only)
      parameters:
        - $ref: '#/components/parameters/customerId'
        - name: rowVersion
          in: query
          required: true
          description: The row version returned when reading the customer, including any fractional seconds.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00'
      responses:
        '204':
          description: Customer deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /customers/transactionHeads/{transactionHeadId}:
    get:
      tags: [Customers]
      summary: Get all customers and one transaction head
      parameters:
        - $ref: '#/components/parameters/transactionHeadId'
      responses:
        '200':
          description: Composite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersAndTransactionHeadDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /customers/{customerId}/transactionHeads:
    get:
      tags: [Customers]
      summary: Get customer and transaction heads
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Composite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAndTransactionHeadsDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /customers/{customerId}/transactionHeads/{transactionHeadId}:
    get:
      tags: [Customers]
      summary: Get customer and transaction head
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/transactionHeadId'
      responses:
        '200':
          description: Composite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAndTransactionHeadDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /customers/{customerId}/transactionHeads/{transactionHeadId}/transactionRows:
    get:
      tags: [Customers]
      summary: Get customer, transaction head and all transaction rows
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/transactionHeadId'
      responses:
        '200':
          description: Composite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWithTransactionHeadAndRowsDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /customers/{customerId}/transactionHeads/{transactionHeadId}/transactionRows/{transactionRowId}:
    get:
      tags: [Customers]
      summary: Get customer, transaction head and one transaction row
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/transactionHeadId'
        - $ref: '#/components/parameters/transactionRowId'
      responses:
        '200':
          description: Composite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWithTransactionHeadAndRowDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /transactionHeads:
    post:
      tags: [Transaction Heads]
      summary: Create transaction head
      description: Requires read access to both lender and borrower customers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionHeadDTO'
      responses:
        '200':
          description: Transaction head created
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /transactionHeads/{transactionHeadId}:
    parameters:
      - $ref: '#/components/parameters/transactionHeadId'
    get:
      tags: [Transaction Heads]
      summary: Read a transaction head accessible through either customer
      responses:
        '200':
          description: Transaction head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHeadDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Transaction Heads]
      summary: Update a transaction head accessible through either stored customer
      description: The path supplies the ID. Lender and borrower cannot be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionHeadDTO'
      responses:
        '200':
          description: Transaction head updated
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

    delete:
      tags: [Transaction Heads]
      summary: Mark transaction head as deleted
      description: Requires access through either stored lender or borrower. The path identifies the head.
      parameters:
        - name: rowVersion
          in: query
          required: true
          description: The row version returned when reading the head, including any fractional seconds.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00'
      responses:
        '204':
          description: Transaction head deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /transactionRows/{transactionRowId}:
    parameters:
      - $ref: '#/components/parameters/transactionRowId'
    get:
      tags: [Transaction Rows]
      summary: Get transaction row by id
      responses:
        '200':
          description: Transaction row returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRowDTO'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Transaction Rows]
      summary: Update a transaction row
      description: The path identifies the row. Requires access to the stored parent head, which cannot be changed. Supply the row version returned when reading the row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRowDTO'
      responses:
        '200':
          description: Transaction row updated
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags: [Transaction Rows]
      summary: Mark transaction row as deleted
      description: The path identifies the row. Requires access to the stored parent head and a matching client row version.
      parameters:
        - name: rowVersion
          in: query
          required: true
          description: The row version returned when reading the row, including any fractional seconds.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00'
      responses:
        '204':
          description: Transaction row deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

        '409':
          $ref: '#/components/responses/ConflictError'

  /transactionRows:
    post:
      tags: [Transaction Rows]
      summary: Create a transaction row
      description: Requires access to the requested parent head. The database assigns the ID and version; the request contains only creation fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRowDTO'
      responses:
        '200':
          description: Transaction row created
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    customerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    transactionHeadId:
      name: transactionHeadId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    transactionRowId:
      name: transactionRowId
      in: path
      required: true
      schema:
        type: integer
        format: int32

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validationFailed:
              summary: Validation failed
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 400
                error: "Bad Request"
                code: "VALIDATION_FAILED"
                message: "Validation failed for one or more fields."
                path: "/auth/register"
                details:
                  - code: "NOT_BLANK"
                    field: "email"
                    message: "Email is missing"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            tokenInvalid:
              summary: Invalid access token
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 401
                error: "Unauthorized"
                code: "TOKEN_INVALID"
                message: "Invalid token."
                path: "/customers/1"
                details:
                  tokenType: "ACCESS"
            tokenExpired:
              summary: Expired access token
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 401
                error: "Unauthorized"
                code: "TOKEN_EXPIRED"
                message: "Token expired."
                path: "/customers/1"
                details:
                  tokenType: "ACCESS"
            authenticationFailed:
              summary: Authentication context unresolved
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 401
                error: "Unauthorized"
                code: "AUTHENTICATION_FAILED"
                message: "Authentication failed."
                path: "/customers/1"
                details: null
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            accountNotActivated:
              summary: Pending account blocked by UserStatusFilter
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 403
                error: "Forbidden"
                code: "ACCOUNT_NOT_ACTIVATED"
                message: "Please activate your account first."
                path: "/customers/1"
                details: null
            resourceAccessDenied:
              summary: Resource authorization failed
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 403
                error: "Forbidden"
                code: "RESOURCE_ACCESS_DENIED"
                message: "You do not have permission to access this customer."
                path: "/customers/1"
                details:
                  resourceType: "CUSTOMER"
                  resourceId: 1
                  action: "READ"
                  metadata:
                    userId: 42
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            resourceNotFound:
              summary: Requested resource does not exist
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 404
                error: "Not Found"
                code: "RESOURCE_NOT_FOUND"
                message: "The requested resource was not found."
                path: "/customers/999"
                details:
                  resourceType: "CUSTOMER"
                  resourceId: 999
                  metadata: null
    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rowVersionMismatch:
              summary: Optimistic lock conflict
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 409
                error: "Conflict"
                code: "ROW_VERSION_MISMATCH"
                message: "The resource was modified by another process. Please refresh and try again."
                path: "/customers/1"
                details: null
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internalServerError:
              summary: Unexpected server failure
              value:
                timestamp: "2026-03-14T10:00:00Z"
                status: 500
                error: "Internal Server Error"
                code: "INTERNAL_SERVER_ERROR"
                message: "An unexpected error occurred."
                path: "/auth/logout"
                details: null

  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          description: Optional structured context. Shape depends on `code`.
          nullable: true

    ValidationErrorDetailList:
      type: array
      items:
        $ref: '#/components/schemas/ValidationErrorDetail'

    ValidationErrorDetail:
      type: object
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [NOT_NULL, NOT_BLANK, NOT_EMPTY, SIZE, PATTERN, EMAIL, PAST, PAST_OR_PRESENT, FUTURE, FUTURE_OR_PRESENT, MIN, MAX, POSITIVE, POSITIVE_OR_ZERO, NEGATIVE, NEGATIVE_OR_ZERO, DIGITS, ASSERT_TRUE, ASSERT_FALSE, VALIDATION_ERROR, UNKNOWN]
        field:
          type: string
        message:
          type: string

    TokenErrorDetail:
      type: object
      required: [tokenType]
      properties:
        tokenType:
          type: string
          enum: [ACCESS, REFRESH, RECOVERY, ACTIVATION]

    ResourceNotFoundDetail:
      type: object
      required: [resourceType]
      properties:
        resourceType:
          type: string
          enum: [USER, CUSTOMER, TRANSACTION_HEAD, TRANSACTION_ROW, UNKNOWN]
        resourceId:
          type: integer
          format: int32
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    ResourceAccessDeniedDetail:
      type: object
      required: [resourceType, action]
      properties:
        resourceType:
          type: string
          enum: [USER, CUSTOMER, TRANSACTION_HEAD, TRANSACTION_ROW, UNKNOWN]
        resourceId:
          type: integer
          format: int32
          nullable: true
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, UNKNOWN]
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    AuthenticationDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegistrationDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenDTO:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    EmailDTO:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ChangePasswordDTO:
      type: object
      required: [refreshToken, oldPassword, newPassword, confirmNewPassword]
      properties:
        refreshToken:
          type: string
        oldPassword:
          type: string
        newPassword:
          type: string
        confirmNewPassword:
          type: string

    SetNewPasswordDTO:
      type: object
      required: [recoveryToken, newPassword, confirmNewPassword]
      properties:
        recoveryToken:
          type: string
        newPassword:
          type: string
        confirmNewPassword:
          type: string

    RecoveryTokenDTO:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AccessTokenDTO:
      type: object
      required: [accessToken, message, accountStatus]
